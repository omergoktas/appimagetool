name: Build

# Builds appimagetool for x86_64 and aarch64 with the AppImage project's own
# build scripts and, for a tag, publishes the files as a release.
#
# What this fork changes in the AppImage project's workflow, scripts and code,
# and nothing else:
# - appimagetool no longer stops when the machine has no file command, which
#   it never runs, so it works on a bare system such as an ubuntu container.
# - The release is made by GitHub's own gh, not by a tool downloaded from
#   another repository's moving release.
# - Only the job that makes the release may write to the repository, and the
#   checkout keeps no token in the clone the build container sees.
# - Actions are named by commit, ci/build-in-docker.sh names its Alpine image
#   by digest, and the scripts in ci check the SHA-256 of every file they
#   download: the sources of squashfs-tools and desktop-file-utils, and the
#   runtime, which comes from this account's fork of type2-runtime.
# - Each job has a time limit, and a second run for the same tag waits for the
#   first.
# - It builds the two architectures this fork is used for.

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

# A second run for the same tag waits for the first instead of cancelling it
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ARCH: x86_64
            RUNS_ON: ubuntu-24.04
          - ARCH: aarch64
            RUNS_ON: ubuntu-24.04-arm

    name: Build ${{ matrix.ARCH }}

    runs-on: ${{ matrix.RUNS_ON }}
    timeout-minutes: 30

    env:
      ARCH: ${{ matrix.ARCH }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
          persist-credentials: false

      - name: Build in Docker container
        run: |
          bash -ex ci/build-in-docker.sh

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Artifact name
          name: appimagetool-${{ matrix.ARCH }}.build
          path: |
            **/appimagetool*.AppImage*

  upload:
    name: Create release and upload artifacts
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - name: Inspect directory after downloading artifacts
        run: ls -alFR
      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          cp ./*/appimagetool*.AppImage* release/
          cd release
          sha256sum appimagetool* > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Built from commit $GITHUB_SHA by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            appimagetool* SHA256SUMS
